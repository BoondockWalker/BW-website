<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Field Notes — Boondock Walker</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F4ECDA; color: #14100C; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: inherit; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="NotesNav.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="FieldNotesData.jsx"></script>
<script type="text/babel" src="FieldNotesA.jsx"></script>
<script type="text/babel" src="FieldNotesB.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo } = React;

const FN_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "themedTags": true,
  "diaryRail": false,
  "indexRail": true,
  "showFeatured": true
}/*EDITMODE-END*/;

function FieldNotesPage() {
  const [tweaks, setTweak] = useTweaks(FN_TWEAK_DEFAULTS);
  const isMobile = useMediaQuery("(max-width: 900px)");
  const [activeTag, setActiveTag] = useState("All");

  const filtered = useMemo(() => {
    if (activeTag === "All") return FN_NOTES;
    return FN_NOTES.filter(n => n.tag === activeTag);
  }, [activeTag]);

  const featured = filtered[0];
  const rest = filtered.slice(1);

  // Footer citation rail
  const Foot = () => (
    <footer style={{ background: BW.ink, color: BW.chalk50, fontFamily: BW.ffG, padding: "44px clamp(20px, 5vw, 64px)", borderTop: `1.5px solid ${BW.ink}` }}>
      <div style={{ maxWidth: 1440, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 32, alignItems: "start" }}>
        <div>
          <img src="assets/BW-lockup-color.svg?v=8" alt="Boondock Walker" style={{ height: 39, display: "block" }} />
          <div style={{ fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: BW.chalk3, marginTop: 14 }}>The bureau · est. 2015 · Cleveland</div>
        </div>
        <div style={{ fontFamily: BW.ffM, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: BW.chalk2, lineHeight: 2 }}>
          <a href="work.html" style={{ display: "block", color: BW.chalk2, textDecoration: "none" }}>Work</a>
          <a href="capabilities.html" style={{ display: "block", color: BW.chalk2, textDecoration: "none" }}>Capabilities</a>
          <a href="field-notes.html" style={{ display: "block", color: BW.brass, textDecoration: "none" }}>Field Notes</a>
        </div>
        <div style={{ fontFamily: BW.ffSerif, fontSize: 14, color: BW.chalk2, lineHeight: 1.6, fontStyle: "italic" }}>
          "If your buyer doesn't have a name for what you do, you can't be searched. So name it."<br/><span style={{ fontStyle: "normal", fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: BW.chalk3 }}>— No 15</span>
        </div>
        <div style={{ fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: BW.chalk3, lineHeight: 1.8 }}>© 2026 BDW Bureau<br/>RSS · Atom · Plain text</div>
      </div>
    </footer>
  );

  return (
    <div style={{ background: BW.chalk, minHeight: "100vh" }}>
      <SiteHeader current="Field Notes" sticky={true} />
      <NotesNav current="Blog" />
      <FNMasthead filterCount={filtered.length} totalCount={FN_NOTES.length} />
      <div style={{ position: "sticky", top: 0, zIndex: 20 }}><FNFilterRail activeTag={activeTag} setActiveTag={setActiveTag} themed={tweaks.themedTags} /></div>

      {tweaks.showFeatured && featured && <FNFeatured note={featured} themed={tweaks.themedTags} />}

      {/* Body — bulletin grid + side rails */}
      <section style={{ background: BW.chalk, borderBottom: `1.5px solid ${BW.ink}` }}>
        <div style={{ maxWidth: 1440, margin: "0 auto", padding: "clamp(40px, 5vw, 64px) clamp(20px, 5vw, 64px)" }}>
          <div style={{ display: "grid", gridTemplateColumns: (tweaks.diaryRail || tweaks.indexRail) && !isMobile ? "minmax(0, 2.4fr) minmax(260px, 1fr)" : "1fr", gap: "clamp(28px, 3vw, 48px)" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", paddingBottom: 14, borderBottom: `1.5px solid ${BW.ink}` }}>
                <h2 style={{ fontFamily: BW.ffD, fontStyle: "italic", fontWeight: 400, fontSize: "clamp(28px, 3.4vw, 40px)", lineHeight: 1, letterSpacing: "-0.02em", margin: 0 }}>The bulletin.</h2>
                <span style={{ fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.24em", textTransform: "uppercase", color: BW.ink2, fontWeight: 600 }}>{rest.length} more notes filed</span>
              </div>
              <FNBulletinGrid notes={rest} themed={tweaks.themedTags} />
              <FNEndCard />
            </div>

            {(tweaks.diaryRail || tweaks.indexRail) && (
              <div style={{ display: "flex", flexDirection: "column", gap: 20, position: isMobile ? "static" : "sticky", top: isMobile ? "auto" : 80, alignSelf: "start" }}>
                <FNNewsletterRail />
                {tweaks.diaryRail && <FNDiary />}
                {tweaks.indexRail && <FNIndex notes={FN_NOTES} />}
              </div>
            )}
          </div>
        </div>
      </section>

      <Foot />

      <TweaksPanel title="Tweaks · Field Notes">
        <TweakSection label="Layout">
          <TweakToggle label="Featured story" hint="Lead with latest note as hero" value={tweaks.showFeatured} onChange={(v) => setTweak("showFeatured", v)} />
          <TweakToggle label="Operator's diary rail" value={tweaks.diaryRail} onChange={(v) => setTweak("diaryRail", v)} />
          <TweakToggle label="Index rail (all notes)" value={tweaks.indexRail} onChange={(v) => setTweak("indexRail", v)} />
        </TweakSection>
        <TweakSection label="Visual treatment">
          <TweakToggle label="Themed tag colors" hint="Off = monochrome ink-only" value={tweaks.themedTags} onChange={(v) => setTweak("themedTags", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FieldNotesPage />);
</script>
</body>
</html>
