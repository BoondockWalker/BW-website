<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boondock Walker — O'Neil Digital Solutions · Specimen №01</title>
<link rel="icon" href="assets/BW-crest.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; background: #FBF7EE; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: #14100C; }
  a { cursor: pointer; }
  a:hover { opacity: 0.92; }
  ::selection { background: #C44A2A; color: #FBF7EE; }
</style>
</head>
<body>
<div id="root" data-screen-label="01 Case Detail · O'Neil Digital Solutions"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="V3Sections2.jsx"></script>
<script type="text/babel" src="WorkData.jsx"></script>
<script type="text/babel" src="CaseReveal.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="CaseBlocks.jsx"></script>
<script type="text/babel" src="CaseDetailData.jsx"></script>
<script type="text/babel">
function CaseApp() {
  const d = window.BW_CASE_DETAIL;
  const all = window.BW_CASES || [];
  const idx = all.findIndex(c => c.slug === d.slug);
  const prev = idx > 0 ? all[idx - 1] : (all.length ? all[all.length - 1] : null);
  const next = idx >= 0 && idx < all.length - 1 ? all[idx + 1] : (all.length ? all[0] : null);
  return (
    <div>
      <SiteHeader
        current="Work"
        breadcrumb={{
          parent: { href: "work.html", label: "Work" },
          label: d.client,
          badge: `Specimen №${d.no}`,
        }}
      />
      <CaseHero d={d} />
      <CaseBlocks blocks={d.blocks} />
      <CaseAdjacent prev={prev} next={next} />
      <V3Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<CaseApp />);
</script>
</body>
</html>
