<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>About — Boondock Walker</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<style>
  html, body { margin: 0; padding: 0; background: #F4ECDA; color: #14100C; }
  *, *::before, *::after { box-sizing: border-box; }
  a { color: inherit; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
  ::selection { background: #C8962B; color: #14100C; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="AboutData.jsx"></script>
<script type="text/babel" src="AboutSections.jsx"></script>

<script type="text/babel" data-presets="env,react">
const ABOUT_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showDiagram": true,
  "showBuild": true,
  "showShelf": true,
  "showLedger": true
}/*EDITMODE-END*/;

function AboutPage() {
  const [tweaks, setTweak] = useTweaks(ABOUT_TWEAK_DEFAULTS);
  const Foot = () => (
    <footer style={{ background: BW.ink, color: BW.chalk50, fontFamily: BW.ffG, padding: "44px clamp(20px, 5vw, 64px)" }}>
      <div style={{ maxWidth: 1240, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 32, alignItems: "start" }}>
        <div>
          <img src="assets/BW-lockup-color.svg?v=8" alt="Boondock Walker" style={{ height: 39, display: "block" }} />
          <div style={{ fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: BW.chalk3, marginTop: 14 }}>The bureau · est. 2015 · Cleveland</div>
        </div>
        <div style={{ fontFamily: BW.ffM, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: BW.chalk2, lineHeight: 2 }}>
          <a href="work.html" style={{ display: "block", color: BW.chalk2, textDecoration: "none" }}>Work</a>
          <a href="capabilities.html" style={{ display: "block", color: BW.chalk2, textDecoration: "none" }}>Capabilities</a>
          <a href="field-notes.html" style={{ display: "block", color: BW.chalk2, textDecoration: "none" }}>Field Notes</a>
          <a href="about.html" style={{ display: "block", color: BW.brass, textDecoration: "none" }}>About</a>
        </div>
        <div style={{ fontFamily: BW.ffM, fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: BW.chalk3, lineHeight: 1.8 }}>© 2026 BDW Bureau<br/>hello@boondockwalker.com<br/>833-997-8574</div>
      </div>
    </footer>
  );

  return (
    <div style={{ background: BW.chalk, minHeight: "100vh" }}>
      <SiteHeader current="About" sticky={true} />
      <AboutHero showDiagram={tweaks.showDiagram} />
      <AboutCodes codes={AB_CODES} />
      {tweaks.showBuild && <AboutBuild panels={AB_BUILD} />}
      <AboutTeam team={AB_TEAM} />
      {(tweaks.showShelf || tweaks.showLedger) && <AboutShelfLedger shelf={tweaks.showShelf ? AB_SHELF : []} ledger={tweaks.showLedger ? AB_LEDGER : []} />}
      <AboutCTA />
      <Foot />

      <TweaksPanel title="Tweaks · About">
        <TweakSection label="Sections">
          <TweakToggle label="Hero diagram (brand-at-center)" value={tweaks.showDiagram} onChange={(v) => setTweak("showDiagram", v)} />
          <TweakToggle label="How the bureau is built" value={tweaks.showBuild} onChange={(v) => setTweak("showBuild", v)} />
          <TweakToggle label="The shelf (reading)" value={tweaks.showShelf} onChange={(v) => setTweak("showShelf", v)} />
          <TweakToggle label="Tenure ledger" value={tweaks.showLedger} onChange={(v) => setTweak("showLedger", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AboutPage />);
</script>
</body>
</html>
