<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boondock Walker — Work / Selected Receipts</title>
<link rel="icon" href="assets/BW-crest.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; background: #F4ECDA; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: #14100C; }
  a { cursor: pointer; }
  a:hover { opacity: 0.92; }
  select { font-family: inherit; }
</style>
</head>
<body>
<div id="root" data-screen-label="01 Work Index"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="V3Sections2.jsx"></script>
<script type="text/babel" src="WorkData.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="WorkArchive.jsx"></script>
<script type="text/babel" src="WorkGrid.jsx"></script>
<script type="text/babel">
// Rotates the featured case on a per-session basis using two cookies:
//   bw_featured_idx     — long-lived, stores the last shown index
//   bw_featured_session — session-only marker; presence means "same session,
//                         keep showing the same featured case"
// On a new session (cookie missing), advance to the next index and persist.
// Refreshes within a session show the same case (the session marker
// suppresses rotation until the browser/tab session ends).
function pickRotatedFeatured(all) {
  if (typeof document === "undefined" || !all.length) return all[0];
  const cookies = Object.fromEntries(
    document.cookie.split(";").map(c => {
      const eq = c.indexOf("=");
      return eq < 0 ? [c.trim(), ""] : [c.slice(0, eq).trim(), c.slice(eq + 1).trim()];
    }).filter(([k]) => k)
  );
  const persisted = parseInt(cookies["bw_featured_idx"], 10);
  let idx;
  if (cookies["bw_featured_session"]) {
    idx = isNaN(persisted) ? 0 : persisted;
  } else {
    idx = isNaN(persisted) ? 0 : (persisted + 1) % all.length;
    document.cookie = `bw_featured_idx=${idx}; max-age=${60 * 60 * 24 * 365}; path=/`;
    document.cookie = `bw_featured_session=1; path=/`;
  }
  return all[idx] || all[0];
}

function WorkApp() {
  const isMobile = useMediaQuery("(max-width: 900px)");
  const [pillar, setPillar] = React.useState("All");
  const [industry, setIndustry] = React.useState("All industries");
  const [outcome, setOutcome] = React.useState("All outcomes");
  const [sort, setSort] = React.useState("Most recent");
  const [view, setView] = React.useState("grid");

  const all = window.BW_CASES;
  const featured = React.useMemo(() => pickRotatedFeatured(all), [all]);
  // Ledger below shows every case, including whichever one is currently
  // featured up top. Duplication (once as feature, once as row) is the
  // right tradeoff for a portfolio archive — every client should be
  // findable in one predictable list regardless of which case is
  // rotating through the featured slot this session.
  const rest = all;

  const filtered = rest.filter(c => {
    if (pillar !== "All" && !(c.pillars || []).includes(pillar)) return false;
    if (industry !== "All industries" && !(c.industries || []).includes(industry)) return false;
    if (outcome !== "All outcomes" && c.outcome !== outcome) return false;
    return true;
  });

  const sorted = [...filtered].sort((a, b) => {
    if (sort === "Oldest") return parseInt(a.year) - parseInt(b.year);
    if (sort === "By pillar") return a.pillar.localeCompare(b.pillar);
    if (sort === "By outcome") return a.outcome.localeCompare(b.outcome);
    return parseInt(b.year) - parseInt(a.year);
  });

  return (
    <div>
      <SiteHeader current="Work" sticky={true} />
      <WorkMasthead count={all.length} filterCount={sorted.length + (isMobile ? 0 : 1)} />
      {!isMobile && <FeaturedCase c={featured} />}
      <FilterRow {...{ pillar, setPillar, industry, setIndustry, outcome, setOutcome, sort, setSort, view, setView }} />
      <ArchiveGrid cases={sorted} view={view} pillar={pillar} />
      <WorkClosing />
      <V3Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<WorkApp />);
</script>
</body>
</html>
