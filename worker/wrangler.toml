name = "bw-brand-triage"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Tighten this to your production origin(s) once deployed.
# During dev, "*" is fine.
[vars]
ALLOWED_ORIGINS = "https://boondockwalker.github.io,https://boondockwalker.com,http://localhost:8000"
EMAIL_FROM = "Boondock Walker <hello@boondockwalker.com>"
EMAIL_SUBJECT = "Your Brand Triage Report"

# Secrets — set with `wrangler secret put NAME`:
#   ANTHROPIC_API_KEY   — Anthropic API key (sk-ant-…)
#   RESEND_API_KEY      — Resend API key (re_…)
#
# Optional secret:
#   BCC_ADDRESS         — internal mailbox to BCC every triage report on
