<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boondock Walker — The Lab / Applied AI for marketing</title>
<link rel="icon" href="assets/BW-crest.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; background: #14100C; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: #14100C; }
  a { cursor: pointer; }
  a:hover { opacity: 0.92; }
  html { scroll-behavior: smooth; }
</style>
</head>
<body>
<div id="root" data-screen-label="04 Lab"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="V3Sections2.jsx"></script>
<script type="text/babel" src="LabData.jsx"></script>
<script type="text/babel" src="LabA.jsx"></script>
<script type="text/babel" src="LabB.jsx"></script>
<script type="text/babel">
const LAB_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showThesis": true,
  "showRules": true,
  "showProduction": true,
  "showSpecimens": true,
  "showReceipts": true
}/*EDITMODE-END*/;

function LabApp() {
  const [tweaks, setTweak] = useTweaks(LAB_DEFAULTS);

  return (
    <div>
      <SiteHeader current="The Lab" sticky={true} bisect={false} tone="dark" />
      <LabHero />
      {tweaks.showThesis && <LabThesis />}
      {tweaks.showRules && <LabRules />}
      {tweaks.showProduction && <LabProduction />}
      {tweaks.showSpecimens && <LabSpecimens />}
      {tweaks.showReceipts && <LabReceipts />}
      <LabCTA />
      <V3Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Sections">
          <TweakToggle label="Thesis" value={tweaks.showThesis} onChange={v => setTweak("showThesis", v)} />
          <TweakToggle label="House rules" value={tweaks.showRules} onChange={v => setTweak("showRules", v)} />
          <TweakToggle label="In production" value={tweaks.showProduction} onChange={v => setTweak("showProduction", v)} />
          <TweakToggle label="Specimens" value={tweaks.showSpecimens} onChange={v => setTweak("showSpecimens", v)} />
          <TweakToggle label="Receipts" value={tweaks.showReceipts} onChange={v => setTweak("showReceipts", v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<LabApp />);
</script>
</body>
</html>
